name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Installer and linter tests
        run: bash tests/test_install.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck install.sh scripts/*.sh tests/*.sh

  lint-self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install into scratch dir and lint the spine
        run: |
          d="$(mktemp -d)"
          ./install.sh --target "$d" >/dev/null
          ./scripts/loop-lint.sh "$d"
